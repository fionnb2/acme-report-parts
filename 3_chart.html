<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Calibri, sans-serif; }

  .chart-wrap {
    background: #ffffff;
    border: 1px solid #DDE3EF;
    border-radius: 6px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .chart-wrap img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }

  .chart-caption {
    margin-top: 8px;
    font-size: 10px;
    color: #777777;
    font-style: italic;
    text-align: center;
  }

  .chart-source {
    font-size: 9px;
    color: #999999;
    text-align: center;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="chart-wrap">
    <!--
      INSTRUCTIONS:
      1. Upload your chart PNG to a SharePoint document library (e.g. Site Assets).
      2. Copy the direct URL to the file.
      3. Replace PASTE_YOUR_IMAGE_URL_HERE below with that URL.
    -->
    <img src="PASTE_YOUR_IMAGE_URL_HERE" alt="Net Revenue by Quarter chart" />
    <div class="chart-caption">Figure 1 — Amount per Account, Date (Net Revenue, in Million USD)</div>
    <div class="chart-source">Source: SAP Analytics Cloud</div>
  </div>
</body>
</html>
